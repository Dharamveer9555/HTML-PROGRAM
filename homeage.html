<!DOCTYPE html>
<html>
<head>
    <title>Static Homepage Using Frames</title>
</head>

<frameset rows="10%,80%">
    <!-- Header Frame -->
    <frame src="header.html" name="header">

    <!-- Menu and Content Frames -->
    <frameset cols="25%,75%">
        <frame src="menu.html" name="menu">
        <frame src="home.html" name="content">
    </frameset>

    <noframes>
        <body>
            Your browser does not support frames.
        </body>
    </noframes>
</frameset>

</html>
