<!DOCTYPE html>
<html>
<head>
    <title>Class Time Table</title>
    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: lightblue;
        }
        h2 {
            text-align: center;
        }
    </style>
</head>
<body>

<h2>Class Time Table</h2>

<table border="1px">
    <tr>
        <th>Day</th>
        <th>9:00 - 10:00</th>
        <th>10:00 - 11:00</th>
        <th>11:00 - 12:00</th>
        <th>12:00 - 1:00</th>
        <th>2:00 - 3:00</th>
    </tr>

    <tr>
        <td>Monday</td>
        <td>Math</td>
        <td>English</td>
        <td>Science</td>
        <td rowspan="5">Lunch</td>
        <td>Computer</td>
    </tr>

    <tr>
        <td>Tuesday</td>
        <td>Physics</td>
        <td>Chemistry</td>
        <td>Math</td>
        <td>English</td>
    </tr>

    <tr>
        <td>Wednesday</td>
        <td>Biology</td>
        <td>Math</td>
        <td>Computer</td>
        <td>Sports</td>
    </tr>

    <tr>
        <td>Thursday</td>
        <td>English</td>
        <td>Science</td>
        <td>Math</td>
        <td>Art</td>
    </tr>

    <tr>
        <td>Friday</td>
        <td>Computer</td>
        <td>Physics</td>
        <td>Chemistry</td>
        <td>Library</td>
    </tr>
</table>

</body>
</html>
